<main class="wrap">
<div class="controls">
<label class="query">Ort, PLZ oder Stadtteil<input type="search" id="query" placeholder="z. B. Frankfurt" autocomplete="off"></label>
<label class="kind">Angebotsart<select id="kind"><option>Alle</option><option>Mieten</option><option>Kaufen</option></select></label>
<button type="button" id="show-saved" aria-pressed="false">Merkliste</button>
</div>
<p id="status" role="status"></p><div class="cards" id="cards"></div><noscript>Bitte aktivieren Sie JavaScript, um die Beispielangebote zu durchsuchen.</noscript>
</main>
<footer><div class="wrap">Alle Inserate sind frei erfundene Beispiele. Die Datei funktioniert ohne Netzwerkzugriff.</div></footer>
<script>
const listings = [
  {id:1, type:"Mieten", city:"Frankfurt am Main", district:"Nordend", zip:"60322", title:"Altbau am Holzhausenpark", size:82, rooms:3, price:1750, photo:0, description:"Hohe Decken, Eichenparkett und große Fenster prägen diese helle Altbauwohnung. Der Holzhausenpark liegt nur wenige Schritte entfernt."},
  {id:2, type:"Mieten", city:"Berlin", district:"Charlottenburg", zip:"10623", title:"Stadtwohnung mit Balkon", size:67, rooms:2, price:1480, photo:1, description:"Ein offener Wohnbereich und bodentiefe Fenster verbinden den Innenraum mit dem Balkon. Cafés und der öffentliche Nahverkehr sind zu Fuß erreichbar."},
  {id:3, type:"Kaufen", city:"München", district:"Bogenhausen", zip:"81679", title:"Stilvolles Wohnen im Altbau", size:115, rooms:4, price:1190000, photo:2, description:"Klassische Fassadendetails und ein großzügiger Grundriss zeichnen diese Altbauwohnung in einer ruhigen Seitenstraße aus."}
];

const q=document.querySelector('#query'), kind=document.querySelector('#kind'), show=document.querySelector('#show-saved'), cards=document.querySelector('#cards');
const key='hainer-favorites';
let saved=new Set();
try {const ids=JSON.parse(localStorage.getItem(key)); if(Array.isArray(ids)) saved=new Set(ids);} catch {}
const format=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const norm=s=>s.toLocaleLowerCase('de-DE').normalize('NFD').replace(/\p{Diacritic}/gu,'').replaceAll('ß','ss');
function draw(){
 const items=listings.filter(i=>(show.getAttribute('aria-pressed')==='false'||saved.has(i.id))&&(kind.value==='Alle'||i.type===kind.value)&&norm([i.city,i.zip,i.district,i.title].join(' ')).includes(norm(q.value.trim())));
 document.querySelector('#status').textContent=items.length===0?'Keine passenden Angebote.':items.length+(items.length===1?' Beispielangebot':' Beispielangebote');
 cards.replaceChildren();
 for(const i of items){
  const article=document.createElement('article'), place=document.createElement('p'), title=document.createElement('h2'), detail=document.createElement('p'), save=document.createElement('button');
  place.textContent=i.city+' · '+i.district+' · '+i.type;
  title.textContent=i.title;
  detail.textContent=i.size+' m² · '+i.rooms+' Zimmer · '+format.format(i.price)+(i.type==='Mieten'?' / Monat':'');
  save.type='button'; save.dataset.id=i.id; save.textContent=saved.has(i.id)?'Gemerkt':'Merken'; save.setAttribute('aria-pressed',saved.has(i.id)); save.setAttribute('aria-label',i.title+' merken');
  article.append(place,title,detail,save);cards.append(article);
 }
}
q.addEventListener('input',draw);kind.addEventListener('change',draw);
show.addEventListener('click',()=>{show.setAttribute('aria-pressed',show.getAttribute('aria-pressed')==='false');draw()});
cards.addEventListener('click',e=>{
 const save=e.target.closest('[data-id]');if(!save)return;
 const id=Number(save.dataset.id);if(saved.has(id))saved.delete(id);else saved.add(id);
 try{localStorage.setItem(key,JSON.stringify([...saved]));}catch{}
 draw();(cards.querySelector('[data-id="'+id+'"]')||show).focus({preventScroll:true});
});
draw();
</script></body></html>
